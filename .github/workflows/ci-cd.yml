name: QBIT Connect CI/CD Pipeline

on:
  push:
    branches: [ main, "release/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Typecheck & Automated Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      QBIT_ENV: test
      QBIT_SECRET_KEY: ci-test-secret-key-must-be-at-least-48-characters-long
      EMAIL_WEBHOOK_SECRET: ci-email-webhook-secret-min-32-chars
      AI_PROVIDER: mock
      QBIT_AI_ALLOW_MOCK_PROVIDER: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Run Ruff Lint Checks
        run: |
          ruff check backend/app backend/tests --select E,F,W --ignore E501

      - name: Run Automated Pytest Suite
        run: |
          pytest -v backend/tests

      - name: Run Phase 12 Production Smoke Suite
        run: |
          python scripts/phase12_smoke.py

      - name: Run Concurrency & Performance Load Test
        run: |
          python scripts/phase12_load_test.py --users 5 --requests 50

  security-scan:
    name: Dependency & Secret Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python Dependencies
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln || echo "Audit completed with non-blocking notices"

      - name: Check for Uncommitted Hardcoded Secrets
        run: |
          python -c '
          import os, re, sys
          suspicious = [
              re.compile(r"-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----"),
              re.compile(r"(?i)AIzaSy[0-9A-Za-z-_]{35}"),
              re.compile(r"sk-[a-zA-Z0-9]{32,}")
          ]
          found = 0
          for root, dirs, files in os.walk("."):
              if ".git" in root or "venv" in root or ".pytest_cache" in root:
                  continue
              for f in files:
                  if f.endswith((".py", ".env", ".json", ".yml", ".yaml")):
                      path = os.path.join(root, f)
                      try:
                          content = open(path, "r", encoding="utf-8", errors="ignore").read()
                          for pat in suspicious:
                              if pat.search(content):
                                  print(f"Potential secret in {path}")
                                  found += 1
                      except Exception:
                          pass
          if found > 0:
              print(f"Found {found} potential secret occurrences!")
              sys.exit(1)
          print("No high-entropy raw secret patterns discovered.")
          '

  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-test, security-scan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production API & Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: qbit-connect-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
